name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      # An injected postinstall ran in production builds on 12 November 2026
      # (docs/incidents/2026-11-12-injected-install-script.md).
      - name: Refuse install lifecycle scripts
        run: |
          node -e '
            const scripts = require("./package.json").scripts || {};
            const hooks = ["preinstall", "install", "postinstall", "prepublish", "preprepare", "prepare", "postprepare"];
            const found = hooks.filter((name) => name in scripts);
            if (found.length) {
              console.error("package.json must not declare install lifecycle scripts: " + found.join(", "));
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Import works (tests read the generated work files)
        run: npm run works:import

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Run production dependency audit (high/critical)
        env:
          SECURITY_AUDIT_WAIVER: ${{ vars.SECURITY_AUDIT_WAIVER }}
        run: |
          if [ "${SECURITY_AUDIT_WAIVER}" = "true" ]; then
            echo "::warning::Skipping npm audit due to SECURITY_AUDIT_WAIVER=${SECURITY_AUDIT_WAIVER}"
            exit 0
          fi
          npm audit --omit=dev --audit-level=high

      - name: Run production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
