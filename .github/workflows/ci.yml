name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Run production dependency audit (high/critical)
        env:
          SECURITY_AUDIT_WAIVER: ${{ vars.SECURITY_AUDIT_WAIVER }}
        run: |
          if [ "${SECURITY_AUDIT_WAIVER}" = "true" ]; then
            echo "::warning::Skipping npm audit due to SECURITY_AUDIT_WAIVER=${SECURITY_AUDIT_WAIVER}"
            exit 0
          fi
          npm audit --omit=dev --audit-level=high

      - name: Run production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
