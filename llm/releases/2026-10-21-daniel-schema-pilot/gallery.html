<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daniel v3 pilot originals</title><style>
body{margin:0;font:15px/1.5 var(--font-sans,system-ui,sans-serif);color:var(--foreground,#222)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button{font:inherit;cursor:pointer;border:1px solid var(--border,#aaa);background:transparent;color:inherit;border-radius:8px;padding:6px 12px}button[aria-pressed=true]{background:var(--primary,#333);color:var(--primary-foreground,#fff)}figure{margin:0}img{width:100%;height:auto;display:block;border-radius:8px}strong{display:block;margin-top:12px}p{margin:8px 0}.muted{color:var(--muted-foreground,#666);font-size:13px}a{color:inherit}
</style></head><body><nav aria-label="Choose original"></nav><figure><a id="original"><img id="image" alt="Daniel 7:9 pilot original"></a><figcaption><strong id="verdict"></strong><p id="note"></p></figcaption></figure><p class="muted">All three unchanged originals · one image per style · agent assessment only. Human visual and likeness acceptance remains pending.</p><script>
const items=[{"label": "Classical", "src": "outputs/daniel-7-9-ancient-of-days/generic-classical-1.jpg", "verdict": "No-body: review \u00b7 whole case: fail", "note": "A fiery throne and wheels sit beneath long white streams. The bright streams sweep across the seat in cloth-like folds; no distinct head, face or limbs are resolved, but the robe-like mass around the seat remains ambiguous. This is not a confident no-body pass or a confirmed human-body failure. The scene fills the frame and no obvious signature or inscription is visible. These narrow observations do not establish human likeness or release acceptance."}, {"label": "Ink & Watercolor", "src": "outputs/daniel-7-9-ancient-of-days/generic-watercolor-1.jpg", "verdict": "No-body: review \u00b7 whole case: fail", "note": "Bright white radiance spreads over and across the chair with draped, robe-like folds on the seat. A face or distinct limbs are not resolved; the occupied-looking light mass remains ambiguous rather than a no-body pass. Unpainted white paper margins remain at the lower and side edges. This is a full-frame presentation failure independent of the no-form ambiguity."}, {"label": "Byzantine Icon", "src": "outputs/daniel-7-9-ancient-of-days/generic-icon-1.jpg", "verdict": "No-body: pass \u00b7 whole case: fail", "note": "Columns of light over fiery wheels and thrones show no visible human-form divine occupant; Daniel retains ordinary human form. This passes only the narrow no-body criterion. The output repeats the scene in three vertical panels, with borders around the central panel and duplicated side scenes. This is a collage/presentation failure, not merely an optional Icon border limitation."}];const nav=document.querySelector('nav');function show(n){const item=items[n];document.querySelector('#image').src=item.src;document.querySelector('#image').alt=item.label+' — Daniel 7:9';document.querySelector('#original').href=item.src;document.querySelector('#verdict').textContent=item.label+' · '+item.verdict;document.querySelector('#note').textContent=item.note;[...nav.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)));}items.forEach((item,n)=>{const b=document.createElement('button');b.textContent=item.label;b.addEventListener('click',()=>show(n));nav.append(b);});show(0);Promise.all(items.map(item=>new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=item.src;}))).then(()=>console.log('All 3 original images loaded; 3 style controls available.')).catch(()=>console.error('An original image failed to load.'));
</script></body></html>
